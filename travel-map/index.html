<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行マップ | 土田 龍</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-back" href="/">← ポートフォリオ</a>
  <span class="nav-sep">|</span>
  <span class="nav-title">🗾 旅行マップ</span>
</nav>

<!-- HEADER -->
<div class="header">
  <h1>🗾 日本旅行マップ</h1>
  <div class="stats">
    <div>
      <span class="stat-count" id="visited-count">0</span>
      <span class="stat-label"> / 47 都道府県</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot unvisited"></div>未訪問</div>
    <div class="legend-item"><div class="legend-dot visited"></div>訪問済み</div>
  </div>
</div>

<!-- BODY -->
<div class="app-body">

  <!-- MAP -->
  <div class="map-wrap">
    <div class="map-grid" id="map-grid"></div>
  </div>

  <!-- SIDE PANEL -->
  <div class="panel hidden" id="panel">
    <div class="panel-header">
      <div>
        <h2 id="panel-name">—</h2>
        <div class="panel-region" id="panel-region"></div>
      </div>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="panel-empty">
        <div class="panel-empty-icon">📍</div>
        <div>都道府県をクリックして<br>訪問情報を登録しましょう</div>
      </div>
    </div>
    <div class="panel-footer" id="panel-footer" style="display:none">
      <button class="btn btn-save" id="btn-save">保存する</button>
      <button class="btn btn-delete" id="btn-delete" title="記録を削除">🗑</button>
    </div>
  </div>

</div>

<!-- PHOTO MODAL -->
<div class="modal-overlay" id="photo-modal">
  <button class="modal-close" id="modal-close">✕</button>
  <img id="modal-img" src="" alt="">
</div>

<script src="prefectures.js"></script>
<script src="app.js"></script>
</body>
</html>
